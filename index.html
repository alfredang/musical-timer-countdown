<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Break Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Exo+2:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="cyber-bg" aria-hidden="true">
        <span class="sound-wave sound-wave--a"></span>
        <span class="sound-wave sound-wave--b"></span>
        <span class="sound-wave sound-wave--c"></span>
    </div>
    <div class="app-container">
        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button id="close-settings" class="icon-button" aria-label="Close">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="settings-section">
                    <h3>Alarm Sound</h3>
                    <div class="sound-options">
                        <button class="sound-option active" data-sound="dream">Dream</button>
                        <button class="sound-option" data-sound="inspire">Inspire</button>
                        <button class="sound-option" data-sound="wing">Wing</button>
                        <button class="sound-option" data-sound="custom" id="custom-sound-btn">Custom</button>
                        <button class="sound-option" data-sound="silent">Silent</button>
                    </div>
                    <div id="custom-upload-section" class="custom-upload-section hidden">
                        <input type="file" id="custom-audio-input" accept="audio/mp3,audio/mpeg,.mp3" hidden>
                        <button id="upload-audio-btn" class="upload-btn">Upload MP3</button>
                        <span id="custom-audio-name" class="custom-audio-name"></span>
                    </div>
                    <button id="preview-sound" class="preview-btn">Preview Sound</button>
                </div>

                <div class="settings-section">
                    <h3>Color Theme</h3>
                    <div class="theme-options">
                        <button class="theme-option active" data-theme="default" style="--preview-bg: #05060f; --preview-accent: #00f0ff;">
                            <span class="theme-preview"></span>
                            <span>Cyberpunk</span>
                        </button>
                        <button class="theme-option" data-theme="standard" style="--preview-bg: #0f172a; --preview-accent: #3b82f6;">
                            <span class="theme-preview"></span>
                            <span>Standard</span>
                        </button>
                        <button class="theme-option" data-theme="space" style="--preview-bg: #07051a; --preview-accent: #a78bfa;">
                            <span class="theme-preview"></span>
                            <span>Space</span>
                        </button>
                        <button class="theme-option" data-theme="forest" style="--preview-bg: #06180d; --preview-accent: #4ade80;">
                            <span class="theme-preview"></span>
                            <span>Forest</span>
                        </button>
                        <button class="theme-option" data-theme="ocean" style="--preview-bg: #03283f; --preview-accent: #22d3ee;">
                            <span class="theme-preview"></span>
                            <span>Ocean</span>
                        </button>
                        <button class="theme-option" data-theme="sunset" style="--preview-bg: #2a0a3a; --preview-accent: #ff5fa2;">
                            <span class="theme-preview"></span>
                            <span>Sunset</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <main>
            <!-- Progress Ring -->
            <div class="timer-display-container">
                <svg class="progress-ring" viewBox="0 0 500 500">
                    <circle class="progress-ring__circle-bg" stroke="currentColor" stroke-width="12" fill="transparent"
                        r="230" cx="250" cy="250" />
                    <circle class="progress-ring__circle" stroke="currentColor" stroke-width="12" fill="transparent"
                        r="230" cx="250" cy="250" />
                    <g class="ring-hud" fill="transparent" aria-hidden="true">
                        <circle class="ring-hud__ticks" r="245" cx="250" cy="250" pathLength="360"
                            stroke-dasharray="1 5" />
                        <circle class="ring-hud__inner" r="216" cx="250" cy="250" pathLength="360"
                            stroke-dasharray="70 12 4 12 4 18" />
                    </g>
                </svg>
                <div class="ring-beam" aria-hidden="true"></div>
                <div class="timer-display">
                    <div id="time-display" class="time-text">00:00:00</div>
                    <div id="break-label" class="break-label hidden" contenteditable="plaintext-only" spellcheck="false"
                        role="textbox" aria-label="Break label" title="Click to edit"></div>
                    <div id="timer-status" class="status-text">Ready</div>
                </div>
            </div>

            <!-- Presets -->
            <div class="presets">
                <button class="preset-btn" data-time="600">10m</button>
                <button class="preset-btn" data-time="900">15m</button>
                <button class="preset-btn" data-time="1800">30m</button>
                <button class="preset-btn" data-time="2700">45m</button>
                <button class="preset-btn" data-time="3600">1h</button>
                <button class="preset-btn" data-time="4500">1h 15m</button>
                <button class="preset-btn" data-time="5400">1h 30m</button>
                <button id="custom-time-btn" class="preset-btn custom-time-btn" aria-expanded="false"
                    aria-controls="input-section">Custom</button>
            </div>

            <!-- Custom time input (shown after pressing Custom) -->
            <div class="input-section hidden" id="input-section">
                <div class="time-inputs">
                    <div class="input-group">
                        <input type="number" id="input-hours" min="0" max="99" placeholder="00" aria-label="Hours">
                        <label for="input-hours">HR</label>
                    </div>
                    <div class="separator">:</div>
                    <div class="input-group">
                        <input type="number" id="input-minutes" min="0" max="59" placeholder="00" aria-label="Minutes">
                        <label for="input-minutes">MIN</label>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="start-btn" class="control-btn primary">Start</button>
                <button id="pause-btn" class="control-btn secondary" disabled>Pause</button>
                <button id="reset-btn" class="control-btn destr">Reset</button>
                <button id="settings-btn" class="control-btn settings-control" title="Settings" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button id="stop-alarm-btn" class="control-btn stop hidden">Stop Alarm</button>
            </div>

            <!-- Sound Settings -->
            <div class="sound-controls">
                <button id="mute-btn" class="icon-button" aria-label="Toggle Mute">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </button>
                <input type="range" id="time-slider" min="0" max="0" step="any" value="0" aria-label="Adjust time remaining" disabled>
            </div>
        </main>

        <footer>
            <p>Powered by <a href="https://www.tertiarycourses.com.sg/" target="_blank" rel="noopener noreferrer">Tertiary Infotech Academy Pte Ltd</a></p>
        </footer>
    </div>

    <script src="javascript/script.js"></script>
</body>

</html>
